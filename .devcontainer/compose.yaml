name: shinobi-hub-dev
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: sleep infinity
    user: dev
    working_dir: /workspaces/shinobi-hub
    volumes:
      - type: bind
        source: ..
        target: /workspaces/shinobi-hub
      - codex-state:/home/dev/.codex
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: shinobi_hub
      DB_USER: shinobi_dev
      # Public, disposable development password. Never reuse in production.
      DB_PASSWORD: local_dev_only_change_me
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devnet

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: shinobi_hub
      POSTGRES_USER: shinobi_dev
      POSTGRES_PASSWORD: local_dev_only_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shinobi_dev -d shinobi_hub"]
      interval: 5s
      timeout: 5s
      retries: 15
    security_opt:
      - no-new-privileges:true
    networks:
      - devnet

volumes:
  pgdata:
  codex-state:
networks:
  devnet:
